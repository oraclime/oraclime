<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Partner with ORACLIME for reliable technical service coordination.">

    <title>Partner With Us | ORACLIME</title>

    <link rel="icon"
          type="image/x-icon"
          href="favicon.ico">

    <link rel="stylesheet"
          href="style.css">
</head>

<body>

<header class="navbar">

    <div class="nav-container">

        <a href="index.html" class="brand">
            <span class="brand-mark">O</span>
            <span>ORACLIME</span>
        </a>

        <nav class="nav-links">

            <a href="index.html">Services</a>

            <a href="index.html">For Business</a>

            <a href="index.html">Technicians</a>

            <a href="index.html">How It Works</a>

        </nav>

    </div>

</header>


<main class="partner-page">

    <section class="partner-hero">

        <div class="partner-heading">

            <span class="section-label">
                PARTNER WITH ORACLIME
            </span>

            <h1>
                Let's work<br>
                <span>together.</span>
            </h1>

            <p>
                Tell us about yourself and how you would
                like to work with ORACLIME.
            </p>

        </div>


        <div class="partner-form-card">

            <form id="partnerForm">

                <!-- BUSINESS NAME -->

                <div class="form-group">

                    <label for="businessName">
                        Business / Company Name
                    </label>

                    <input
                        type="text"
                        id="businessName"
                        name="businessName"
                        placeholder="Enter business / company name"
                        autocomplete="organization"
                        required>

                </div>


                <!-- CONTACT PERSON -->

                <div class="form-group">

                    <label for="contactName">
                        Contact Person
                    </label>

                    <input
                        type="text"
                        id="contactName"
                        name="contactName"
                        placeholder="Enter contact person name"
                        autocomplete="name"
                        required>

                </div>


                <!-- PHONE + EMAIL -->

                <div class="form-row">

                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter 10-digit mobile number"
                            inputmode="numeric"
                            autocomplete="tel"
                            maxlength="10"
                            pattern="[0-9]{10}"
                            oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10)"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter email address"
                            autocomplete="email">

                    </div>

                </div>


                <!-- PARTNER TYPE -->

                <div class="form-group">

                    <label for="partnerType">
                        What best describes you?
                    </label>

                    <select
                        id="partnerType"
                        name="partnerType"
                        required>

                        <option value="" selected disabled>
                            Select your category
                        </option>

                        <option value="Technician">
                            Technician
                        </option>

                        <option value="AC / HVAC Shop">
                            AC / HVAC Shop
                        </option>

                        <option value="AC / HVAC Warehouse / Distributor">
                            AC / HVAC Warehouse / Distributor
                        </option>

                        <option value="Authorised Service Centre">
                            Authorised Service Centre
                        </option>

                        <option value="Dealer">
                            Dealer
                        </option>

                        <option value="Contractor">
                            Contractor
                        </option>

                        <option value="Facility Management Company">
                            Facility Management Company
                        </option>

                        <option value="Other Business Partner">
                            Other Business Partner
                        </option>

                    </select>

                </div>


                <!-- STATE -->

                <div class="form-group">

                    <label for="state">
                        State / Union Territory
                    </label>

                    <select
                        id="state"
                        name="state"
                        required>

                        <option value="" selected disabled>
                            Select State / Union Territory
                        </option>

                        <option value="Andaman and Nicobar Islands">
                            Andaman and Nicobar Islands
                        </option>

                        <option value="Chandigarh">
                            Chandigarh
                        </option>

                        <option value="Dadra and Nagar Haveli and Daman and Diu">
                            Dadra and Nagar Haveli and Daman and Diu
                        </option>

                        <option value="Delhi">
                            Delhi
                        </option>

                        <option value="Jammu and Kashmir">
                            Jammu and Kashmir
                        </option>

                        <option value="Ladakh">
                            Ladakh
                        </option>

                        <option value="Lakshadweep">
                            Lakshadweep
                        </option>

                        <option value="Puducherry">
                            Puducherry
                        </option>

                        <option value="Andhra Pradesh">
                            Andhra Pradesh
                        </option>

                        <option value="Arunachal Pradesh">
                            Arunachal Pradesh
                        </option>

                        <option value="Assam">
                            Assam
                        </option>

                        <option value="Bihar">
                            Bihar
                        </option>

                        <option value="Chhattisgarh">
                            Chhattisgarh
                        </option>

                        <option value="Goa">
                            Goa
                        </option>

                        <option value="Gujarat">
                            Gujarat
                        </option>

                        <option value="Haryana">
                            Haryana
                        </option>

                        <option value="Himachal Pradesh">
                            Himachal Pradesh
                        </option>

                        <option value="Jharkhand">
                            Jharkhand
                        </option>

                        <option value="Karnataka">
                            Karnataka
                        </option>

                        <option value="Kerala">
                            Kerala
                        </option>

                        <option value="Madhya Pradesh">
                            Madhya Pradesh
                        </option>

                        <option value="Maharashtra">
                            Maharashtra
                        </option>

                        <option value="Manipur">
                            Manipur
                        </option>

                        <option value="Meghalaya">
                            Meghalaya
                        </option>

                        <option value="Mizoram">
                            Mizoram
                        </option>

                        <option value="Nagaland">
                            Nagaland
                        </option>

                        <option value="Odisha">
                            Odisha
                        </option>

                        <option value="Punjab">
                            Punjab
                        </option>

                        <option value="Rajasthan">
                            Rajasthan
                        </option>

                        <option value="Sikkim">
                            Sikkim
                        </option>

                        <option value="Tamil Nadu">
                            Tamil Nadu
                        </option>

                        <option value="Telangana">
                            Telangana
                        </option>

                        <option value="Tripura">
                            Tripura
                        </option>

                        <option value="Uttar Pradesh">
                            Uttar Pradesh
                        </option>

                        <option value="Uttarakhand">
                            Uttarakhand
                        </option>

                        <option value="West Bengal">
                            West Bengal
                        </option>

                    </select>

                </div>


                <!-- CITY + PIN -->

                <div class="form-row">

                    <div class="form-group">

                        <label for="city">
                            City
                        </label>

                        <input
                            type="text"
                            id="city"
                            name="city"
                            placeholder="Enter city"
                            autocomplete="address-level2"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="pinCode">
                            PIN Code
                        </label>

                        <input
                            type="text"
                            id="pinCode"
                            name="pinCode"
                            placeholder="Enter 6-digit PIN code"
                            inputmode="numeric"
                            autocomplete="postal-code"
                            maxlength="6"
                            pattern="[0-9]{6}"
                            oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,6)"
                            required>

                    </div>

                </div>


                <!-- REQUIREMENT -->

                <div class="form-group">

                    <label for="message">
                        Tell us about your requirement
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="5"
                        placeholder="Tell us about your business, service area, or how you would like to partner with ORACLIME"></textarea>

                </div>


                <!-- SUBMIT BUTTON -->

                <button
                    type="submit"
                    class="partner-submit"
                    id="partnerSubmitButton">

                    Submit Partnership Request

                </button>


                <!-- ERROR / PROCESS MESSAGE -->

                <div
                    id="submissionMessage"
                    class="submission-message"
                    style="display:none;">

                </div>

            </form>

        </div>

    </section>

</main>


<script>

document.addEventListener("DOMContentLoaded", function () {

    const form = document.getElementById("partnerForm");

    const button = document.getElementById("partnerSubmitButton");

    const message = document.getElementById("submissionMessage");


    /*
    ==================================================
    GOOGLE APPS SCRIPT WEB APP URL
    ==================================================
    */

    const GOOGLE_SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbx9Jb9dyHGSFsB9gtzBwX5RXywCRGF09-REhj1dJ10k8njPVBQffpSRdqmpGUtXjfG/exec";


    /*
    ==================================================
    PARTNER FORM SUBMIT
    ==================================================
    */

    form.addEventListener("submit", async function (event) {

        event.preventDefault();


        /*
        Browser validation
        */

        if (!form.checkValidity()) {

            form.reportValidity();

            return;

        }


        /*
        Disable button
        */

        button.disabled = true;

        button.textContent = "Submitting...";


        message.style.display = "none";

        message.textContent = "";


        /*
        Collect form data
        */

        const formData = {

            formType: "partner",

            businessName:
                document.getElementById("businessName").value.trim(),

            contactName:
                document.getElementById("contactName").value.trim(),

            phone:
                document.getElementById("phone").value.trim(),

            email:
                document.getElementById("email").value.trim(),

            partnerType:
                document.getElementById("partnerType").value,

            state:
                document.getElementById("state").value,

            city:
                document.getElementById("city").value.trim(),

            pinCode:
                document.getElementById("pinCode").value.trim(),

            message:
                document.getElementById("message").value.trim()

        };


        try {

            /*
            Send data to Google Apps Script
            */

            const response = await fetch(
                GOOGLE_SCRIPT_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "text/plain;charset=utf-8"
                    },

                    body: JSON.stringify(formData)
                }
            );


            const result = await response.json();


            /*
            ==========================================
            SUCCESS
            ==========================================
            */

            if (result.success && result.srn) {

                /*
                Redirect to success page
                */

                window.location.href =
                    "partner-success.html?srn=" +
                    encodeURIComponent(result.srn);

                return;

            }


            /*
            ==========================================
            GOOGLE SCRIPT ERROR
            ==========================================
            */

            throw new Error(
                result.message ||
                "Unable to submit request."
            );


        } catch (error) {

            console.error(
                "ORACLIME Partner Form Error:",
                error
            );


            message.style.display = "block";

            message.textContent =
                "Unable to submit your request right now. Please try again.";


            button.disabled = false;

            button.textContent =
                "Submit Partnership Request";

        }

    });

});

</script>

</body>
</html>
