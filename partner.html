<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Partner with ORACLIME for reliable air conditioner and technical service coordination.">

    <title>Partner With Us | ORACLIME</title>

    <link rel="icon"
          type="image/x-icon"
          href="favicon.ico">

    <link rel="stylesheet"
          href="style.css">
</head>

<body>

    <!-- NAVIGATION -->
    <header class="navbar">
        <div class="nav-container">

            <a href="index.html" class="brand">
                <span class="brand-mark">O</span>
                <span>ORACLIME</span>
            </a>

            <nav class="nav-links">
                <a href="index.html">Services</a>
                <a href="index.html">For Business</a>
                <a href="index.html">Technicians</a>
                <a href="index.html">How It Works</a>
            </nav>

        </div>
    </header>


    <!-- PARTNER PAGE -->
    <main class="partner-page">

        <section class="partner-hero">

            <div class="partner-heading">
                <span class="section-label">PARTNER WITH ORACLIME</span>

                <h1>
                    Let's work<br>
                    <span>together.</span>
                </h1>

                <p>
                    Tell us about your business and how you would
                    like to work with ORACLIME.
                </p>
            </div>


            <!-- FORM -->
            <div class="partner-form-card">

                <form id="partnerForm">

                    <div class="form-group">
                        <label for="businessName">
                            Business / Company Name
                        </label>

                        <input
                            type="text"
                            id="businessName"
                            name="businessName"
                            placeholder="Enter business name"
                            required>
                    </div>


                    <div class="form-group">
                        <label for="contactName">
                            Contact Person
                        </label>

                        <input
                            type="text"
                            id="contactName"
                            name="contactName"
                            placeholder="Enter contact person name"
                            required>
                    </div>


                    <div class="form-row">

                        <div class="form-group">
                            <label for="phone">
                                Phone Number
                            </label>

                            <input
                                type="tel"
                                id="phone"
                                name="phone"
                                placeholder="Enter phone number"
                                required>
                        </div>


                        <div class="form-group">
                            <label for="email">
                                Email
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter email address">
                        </div>

                    </div>


                    <div class="form-group">
                        <label for="city">
                            City
                        </label>

                        <input
                            type="text"
                            id="city"
                            name="city"
                            placeholder="Enter city"
                            required>
                    </div>


                    <div class="form-group">
                        <label for="message">
                            Tell us about your requirement
                        </label>

                        <textarea
                            id="message"
                            name="message"
                            rows="5"
                            placeholder="Tell us how you would like to partner with ORACLIME"></textarea>
                    </div>


                    <button type="submit" class="partner-submit">
                        Submit Partnership Request
                    </button>

                </form>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
