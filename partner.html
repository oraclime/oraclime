<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Partner with ORACLIME for reliable technical service coordination."
  >

  <title>Partner With Us | ORACLIME</title>

  <link
    rel="icon"
    type="image/x-icon"
    href="favicon.ico"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      background: #ffffff;
      color: #102033;
    }

    /* ==============================
       HEADER
    ============================== */

    .header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: #ffffff;
      border-bottom: 1px solid #e7edf3;
    }

    .nav {
      max-width: 1000px;
      margin: auto;
      min-height: 72px;
      padding: 0 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;

      color: #0c1b2a;
      text-decoration: none;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: .3px;
    }

    .brand-icon {
      width: 30px;
      height: 30px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 8px;
      background: #101d2a;
      color: #ffffff;

      font-size: 14px;
      font-weight: 800;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .nav-links a {
      color: #263b50;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }

    .nav-links a:hover {
      color: #0aa47d;
    }

    /* ==============================
       PAGE
    ============================== */

    .page {
      min-height: calc(100vh - 72px);
      padding: 55px 20px 80px;

      background:
        radial-gradient(
          circle at top left,
          #f4fbf9 0,
          #ffffff 42%
        );
    }

    .container {
      width: 100%;
      max-width: 670px;
      margin: auto;
    }

    .heading {
      text-align: center;
      margin-bottom: 30px;
    }

    .heading h1 {
      margin: 0 0 10px;
      font-size: 34px;
      line-height: 1.15;
      color: #0d1d2c;
    }

    .heading p {
      margin: 0 auto;
      max-width: 580px;
      color: #66788a;
      font-size: 15px;
      line-height: 1.6;
    }

    /* ==============================
       FORM CARD
    ============================== */

    .form-card {
      background: #ffffff;
      border: 1px solid #e0e7ed;
      border-radius: 18px;

      padding: 30px;

      box-shadow:
        0 15px 45px rgba(16, 32, 51, .08);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;

      color: #102033;
      font-size: 13px;
      font-weight: 700;
    }

    .required {
      color: #e53935;
    }

    input,
    select,
    textarea {

      width: 100%;

      border: 1px solid #d4dee7;
      border-radius: 9px;

      background: #ffffff;
      color: #142536;

      font-family: inherit;
      font-size: 14px;

      outline: none;

      transition:
        border-color .2s,
        box-shadow .2s;
    }

    input,
    select {
      height: 42px;
      padding: 0 13px;
    }

    textarea {
      min-height: 110px;
      padding: 13px;
      resize: vertical;
    }

    input::placeholder,
    textarea::placeholder {
      color: #9aaabd;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #0aa47d;

      box-shadow:
        0 0 0 3px rgba(10, 164, 125, .10);
    }

    /* ==============================
       MESSAGE
    ============================== */

    .message {
      display: none;

      margin-bottom: 15px;
      padding: 12px 14px;

      border-radius: 8px;

      font-size: 13px;
      line-height: 1.5;
    }

    .message.error {
      display: block;

      background: #fff1f1;
      border: 1px solid #ffcaca;
      color: #a42626;
    }

    /* ==============================
       BUTTON
    ============================== */

    .submit-btn {

      width: 100%;
      height: 46px;

      border: 0;
      border-radius: 9px;

      background: #08a47d;
      color: #ffffff;

      font-family: inherit;
      font-size: 14px;
      font-weight: 800;

      cursor: pointer;

      transition:
        background .2s,
        transform .1s;
    }

    .submit-btn:hover {
      background: #078d6c;
    }

    .submit-btn:active {
      transform: translateY(1px);
    }

    .submit-btn:disabled {
      opacity: .7;
      cursor: not-allowed;
    }

    .small-note {
      margin-top: 13px;

      text-align: center;

      color: #8291a0;
      font-size: 11px;
      line-height: 1.5;
    }

    /* ==============================
       HIDDEN IFRAME
    ============================== */

    #submitFrame {
      display: none;
      width: 0;
      height: 0;
      border: 0;
    }

    /* ==============================
       MOBILE
    ============================== */

    @media (max-width: 700px) {

      .nav {
        min-height: 62px;
      }

      .nav-links {
        display: none;
      }

      .page {
        padding:
          35px 14px 55px;
      }

      .heading h1 {
        font-size: 28px;
      }

      .heading p {
        font-size: 14px;
      }

      .form-card {
        padding: 21px 17px;
        border-radius: 14px;
      }

      .form-row {
        grid-template-columns: 1fr;
        gap: 0;
      }

    }

  </style>

</head>


<body>


  <!-- ==========================================
       HEADER
  =========================================== -->

  <header class="header">

    <nav class="nav">

      <a
        href="index.html"
        class="brand"
      >

        <span class="brand-icon">
          O
        </span>

        ORACLIME

      </a>


      <div class="nav-links">

        <a href="index.html#services">
          Services
        </a>

        <a href="index.html#business">
          For Business
        </a>

        <a href="index.html#technicians">
          Technicians
        </a>

        <a href="index.html#how-it-works">
          How It Works
        </a>

      </div>

    </nav>

  </header>



  <!-- ==========================================
       PAGE
  =========================================== -->

  <main class="page">

    <div class="container">


      <div class="heading">

        <h1>
          Partner With ORACLIME
        </h1>

        <p>
          Tell us about your business or service
          requirements. Our team will contact you
          shortly.
        </p>

      </div>



      <!-- ========================================
           FORM
      ========================================= -->

      <div class="form-card">

        <form
          id="partnerForm"

          method="POST"

          action="https://script.google.com/macros/s/AKfycbx9Jb9dyHGSFsB9gtzBxW5RXywCRGFO9-REhj1dJl0k8njPVBQffpSRdqmpmGUtxjfq/exec"

          target="submitFrame"
        >


          <!-- SRN
               JS ISKO GENERATE KAREGA
          -->

          <input
            type="hidden"
            name="srn"
            id="srnField"
          >



          <!-- BUSINESS NAME -->

          <div class="field">

            <label for="businessName">
              Business / Company Name
              <span class="required">*</span>
            </label>

            <input
              type="text"
              id="businessName"
              name="businessName"
              placeholder="Enter business or company name"
              required
            >

          </div>



          <!-- CONTACT -->

          <div class="field">

            <label for="contactName">
              Contact Person
              <span class="required">*</span>
            </label>

            <input
              type="text"
              id="contactName"
              name="contactName"
              placeholder="Enter contact person name"
              required
            >

          </div>



          <!-- PHONE + EMAIL -->

          <div class="form-row">


            <div class="field">

              <label for="phone">
                Phone Number
                <span class="required">*</span>
              </label>

              <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter 10-digit mobile number"
                inputmode="numeric"
                pattern="[0-9]{10}"
                maxlength="10"
                required
              >

            </div>



            <div class="field">

              <label for="email">
                Email
              </label>

              <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter email address"
              >

            </div>


          </div>



          <!-- PARTNER TYPE -->

          <div class="field">

            <label for="partnerType">
              What best describes you?
              <span class="required">*</span>
            </label>

            <select
              id="partnerType"
              name="partnerType"
              required
            >

              <option value="">
                Select your category
              </option>

              <option value="Technician">
                Technician
              </option>

              <option value="AC New Shop / Warehouse">
                AC New Shop / Warehouse
              </option>

              <option value="Authorised Service Centre">
                Authorised Service Centre
              </option>

              <option value="Dealer / Distributor">
                Dealer / Distributor
              </option>

              <option value="Contractor">
                Contractor
              </option>

              <option value="Corporate / Business">
                Corporate / Business
              </option>

              <option value="Other">
                Other
              </option>

            </select>

          </div>



          <!-- STATE -->

          <div class="field">

            <label for="state">
              State / Union Territory
              <span class="required">*</span>
            </label>

            <select
              id="state"
              name="state"
              required
            >

              <option value="">
                Select State / Union Territory
              </option>

              <option>Andhra Pradesh</option>
              <option>Arunachal Pradesh</option>
              <option>Assam</option>
              <option>Bihar</option>
              <option>Chhattisgarh</option>
              <option>Goa</option>
              <option>Gujarat</option>
              <option>Haryana</option>
              <option>Himachal Pradesh</option>
              <option>Jharkhand</option>
              <option>Karnataka</option>
              <option>Kerala</option>
              <option>Madhya Pradesh</option>
              <option>Maharashtra</option>
              <option>Manipur</option>
              <option>Meghalaya</option>
              <option>Mizoram</option>
              <option>Nagaland</option>
              <option>Odisha</option>
              <option>Punjab</option>
              <option>Rajasthan</option>
              <option>Sikkim</option>
              <option>Tamil Nadu</option>
              <option>Telangana</option>
              <option>Tripura</option>
              <option>Uttar Pradesh</option>
              <option>Uttarakhand</option>
              <option>West Bengal</option>
              <option>Delhi</option>
              <option>Jammu and Kashmir</option>
              <option>Ladakh</option>
              <option>Puducherry</option>
              <option>Chandigarh</option>
              <option>Andaman and Nicobar Islands</option>
              <option>Dadra and Nagar Haveli and Daman and Diu</option>
              <option>Lakshadweep</option>

            </select>

          </div>



          <!-- CITY + PIN -->

          <div class="form-row">


            <div class="field">

              <label for="city">
                City
                <span class="required">*</span>
              </label>

              <input
                type="text"
                id="city"
                name="city"
                placeholder="Enter city"
                required
              >

            </div>



            <div class="field">

              <label for="pinCode">
                PIN Code
                <span class="required">*</span>
              </label>

              <input
                type="text"
                id="pinCode"
                name="pinCode"
                placeholder="Enter 6-digit PIN code"
                inputmode="numeric"
                pattern="[0-9]{6}"
                maxlength="6"
                required
              >

            </div>


          </div>



          <!-- REQUIREMENT -->

          <div class="field">

            <label for="requirement">
              Tell us about your requirement
              <span class="required">*</span>
            </label>

            <textarea
              id="requirement"
              name="requirement"
              placeholder="Tell us about your business, service area, or how you would like to partner with ORACLIME"
              required
            ></textarea>

          </div>



          <!-- ERROR MESSAGE -->

          <div
            id="errorMessage"
            class="message"
          ></div>



          <!-- SUBMIT -->

          <button
            type="submit"
            id="submitBtn"
            class="submit-btn"
          >
            Submit Partnership Request
          </button>



          <div class="small-note">

            Your information will be securely
            submitted to ORACLIME for partnership
            coordination.

          </div>


        </form>

      </div>

    </div>

  </main>



  <!-- ==========================================
       GOOGLE APPS SCRIPT RESPONSE TARGET
  =========================================== -->

  <iframe
    name="submitFrame"
    id="submitFrame"
  ></iframe>



  <!-- ==========================================
       JAVASCRIPT
  =========================================== -->

  <script>

    "use strict";


    /* =========================================
       ELEMENTS
    ========================================= */

    const form =
      document.getElementById("partnerForm");

    const srnField =
      document.getElementById("srnField");

    const submitBtn =
      document.getElementById("submitBtn");

    const errorMessage =
      document.getElementById("errorMessage");

    const submitFrame =
      document.getElementById("submitFrame");


    let isSubmitting = false;


    /* =========================================
       SRN GENERATOR

       IMPORTANT:
       SRN YAHIN GENERATE HOGA.

       APPS SCRIPT MEIN NAHI.
    ========================================= */

    function generateSRN() {

      const now =
        new Date();


      const year =
        now.getFullYear();


      const month =
        String(
          now.getMonth() + 1
        ).padStart(2, "0");


      const day =
        String(
          now.getDate()
        ).padStart(2, "0");


const serial = String(
  1234
).padStart(6, "0");


      return (
        "PT-" +
        year +
        month +
        day +
        "-" +
        serial
      );

    }


    /* =========================================
       PHONE VALIDATION
    ========================================= */

    function validatePhone() {

      const phone =
        document
          .getElementById("phone")
          .value
          .trim();


      return /^[0-9]{10}$/.test(phone);

    }


    /* =========================================
       PIN VALIDATION
    ========================================= */

    function validatePIN() {

      const pin =
        document
          .getElementById("pinCode")
          .value
          .trim();


      return /^[0-9]{6}$/.test(pin);

    }


    /* =========================================
       SHOW ERROR
    ========================================= */

    function showError(message) {

      errorMessage.textContent =
        message;

      errorMessage.className =
        "message error";

      errorMessage.scrollIntoView({
        behavior: "smooth",
        block: "center"
      });

    }


    /* =========================================
       SUBMIT
    ========================================= */

    form.addEventListener(
      "submit",
      function(event) {

        /*
         * Browser ko normal POST karne dena hai.
         *
         * IMPORTANT:
         * event.preventDefault() NAHI.
         */


        if (isSubmitting) {

          event.preventDefault();

          return;

        }


        /* PHONE */

        if (!validatePhone()) {

          event.preventDefault();

          showError(
            "Please enter a valid 10-digit mobile number."
          );

          return;

        }


        /* PIN */

        if (!validatePIN()) {

          event.preventDefault();

          showError(
            "Please enter a valid 6-digit PIN code."
          );

          return;

        }


        /* =====================================
           GENERATE SRN
        ===================================== */

        const srn =
          generateSRN();


        /*
         * SRN hidden input mein.
         */

        srnField.value =
          srn;


        /*
         * Success page ke fallback ke liye
         * browser storage mein bhi save.
         */

        try {

          sessionStorage.setItem(
            "oraclime_partner_srn",
            srn
          );

        } catch (e) {

          console.warn(
            "Session storage unavailable."
          );

        }


        /* =====================================
           LOCK FORM
        ===================================== */

        isSubmitting =
          true;


        submitBtn.disabled =
          true;


        submitBtn.textContent =
          "Submitting...";


        errorMessage.className =
          "message";


        /*
         * YAHAN preventDefault NAHI HAI.
         *
         * Form normal POST karega:
         *
         * partner.html
         *       ↓
         * Google Apps Script
         */


      }
    );


    /* =========================================
       APPS SCRIPT RESPONSE

       Apps Script iframe mein response
       load karega.

       Uske baad success page.
    ========================================= */

    submitFrame.addEventListener(
      "load",
      function() {

        if (!isSubmitting) {
          return;
        }


        const srn =
          srnField.value;


        if (!srn) {
          return;
        }


        /*
         * FINAL REDIRECT
         */

        window.location.href =
          "partner-success.html?srn=" +
          encodeURIComponent(srn);

      }
    );


    /* =========================================
       ONLY NUMBERS - PHONE
    ========================================= */

    document
      .getElementById("phone")
      .addEventListener(
        "input",
        function() {

          this.value =
            this.value
              .replace(/\D/g, "")
              .slice(0, 10);

        }
      );


    /* =========================================
       ONLY NUMBERS - PIN
    ========================================= */

    document
      .getElementById("pinCode")
      .addEventListener(
        "input",
        function() {

          this.value =
            this.value
              .replace(/\D/g, "")
              .slice(0, 6);

        }
      );

  </script>


</body>

</html>
